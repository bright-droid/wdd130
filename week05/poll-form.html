<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form | WDD130 | Bright Ndubuisi</title>
</head>
<body>
    <header>WDD 130 | HTML Form - User Poll</header>
    <main>
        <form>
            <div>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>

            <!-- A valid alternative for writing this -->
            <!-- <label>Full Name: <input type="text" name="fullname" required></label>
            <label>Email: <input type="email" name="useremail" required></label> -->
            <div>
                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="chrome">Chrome</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>

            <div>
                <button type="submit">Submit Poll</button>
            </div>

        </form>
    </main>
    <footer> ©2024 | HTML Form - User Poll Activity | Bright Ndubuisi</footer>
</body>
</html>
